<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon"> 
<style>
body {
    font-family: sans-serif;
}

.error {
    background-color: #fdd;
    border: 1px solid #f00;
    padding: 1em;
}

.hidden {
    display: none;
}

.inputContainer {
    margin: 1em;
    box-sizing: content-box;
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border: 1px solid black;
}

.inputContainer video {
    box-sizing: content-box;
    width: 100%;
    height: auto;
    display: block;
    /* outline: 4px dotted red; */
}

.inputContainer canvas {
    box-sizing: content-box;
    max-width: 100%;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    /* outline: 2px dashed green; */
}

.outputContainer {
    position: relative;
    box-sizing: content-box;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    margin-top: 1em;
    border: 1px solid black;
}

.outputContainer img {
    max-width: 100%;
    display: block;
}

.outputContainer canvas {
    box-sizing: content-box;
    max-width: 100%;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    /* outline: 2px dashed green; */
}

.outputContainer meter {
    display: block;
    width: 80%;
    margin: 0.5em auto;
}

.outputContainer output {
    margin-top: 1em;
    width: 100%;
    font-family: monospace;;
    font-size: x-large;
    white-space: pre-wrap;
}

#rectangleDebug {
    max-width: 100%;
}
</style>
<title>AR Toolkit Marker Detector</title>
</head>
<body>
<h1>AR Toolkit Marker Detector</h1>

<p>Present an AR Toolkit marker to the camera.</p>

<noscript><div class="error">
    ERROR: Scripting is required, but is not currently enabled.  Please enable it and reload. 
</div></noscript>
<div class="error hidden" id="error">
    ERROR: Unknown error.
</div>

<div class="inputContainer">
    <video></video>
</div>

<div class="outputContainer">
    <output></output>
</div>

<hr>

</body>
<script type="module">
import { ArDetector } from './src/ar-detector/ar-detector.js';

const MAX_MARKER_ID = 130;
const MATRIX_TYPE = '4x4_bch_13_9_3'; // '3x3' (x64) / '4x4_bch_13_9_3' (x512)

function showError(message) {
    const errorElement = document.querySelector('#error');
    errorElement.innerHTML = message;
    errorElement.classList.remove('hidden');
}

async function run() {
    console.log('Creating...');
    const detector = new ArDetector({});

    console.log('Initializing...');
    const usePattern = true;
    await detector.initialize(usePattern, MATRIX_TYPE);

    // For debugging, track pattern markers
    if (usePattern) { await detector.trackMarkerPattern('./depends/artoolkit/data/patt.hiro', 2.0); }
    if (usePattern) { await detector.trackMarkerPattern('./depends/artoolkit/data/patt.kanji', 2.0); }

    // For now, track specific barcode markers
    for (let i = 0; i < MAX_MARKER_ID; i++) {
        detector.trackMarkerBarcode(i, 2.0);
    }

    // Set up marker callback
    detector.setMarkerCallback((data, type, id) => {
        //console.log(JSON.stringify(data));

        // const values = {
        //     index: data.index,
        //     type: data.type,                 // -1=?, 1=?  (lost???)
        //     id: data.marker.id,
        //     idPatt: data.marker.idPatt,      // -1=not pattern,>=0=pattern id
        //     idMatrix: data.marker.idMatrix,  // -1=not barcode,>=0=barcode id
        //     dir: data.marker.dir,
        //     dirPatt: data.marker.dirPatt,
        //     cf: data.marker.cf,
        //     cfPatt: data.marker.cfPatt,
        //     cfMatrix: data.marker.cfMatrix,
        //     errorCorrected: data.marker.errorCorrected,
        // };
        //console.log(JSON.stringify(values));

        const info = {
            type: type,                 // -1=?, 1=?  (lost???)
            pattern: data.marker.idPatt >= 0,
            id: data.marker.idPatt >= 0 ? data.marker.idPatt : (data.marker.idMatrix >= 0 ? data.marker.idMatrix : data.marker.id),
        };
        if (info.type >= 0) {
            console.log(JSON.stringify(info));
        } else {
            console.log('Lost?');
        }
    });

    console.log('Running...');
    detector.run();

    console.log('...started.');
    return true;
}

addEventListener("DOMContentLoaded", async (event) => {
    run();
});
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon"> 
<style>
body {
    font-family: sans-serif;
}

.error {
    background-color: #fdd;
    border: 1px solid #f00;
    padding: 1em;
}

.hidden {
    display: none;
}

.inputContainer {
    margin: 1em;
    box-sizing: content-box;
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border: 1px solid black;
}

.inputContainer video {
    box-sizing: content-box;
    width: 100%;
    height: auto;
    display: block;
    /* outline: 4px dotted red; */
}

.inputContainer canvas {
    box-sizing: content-box;
    max-width: 100%;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    /* outline: 2px dashed green; */
}

.outputContainer {
    position: relative;
    box-sizing: content-box;
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    margin-top: 1em;
    border: 1px solid black;
}

.outputContainer img {
    max-width: 100%;
    display: block;
}

.outputContainer canvas {
    box-sizing: content-box;
    max-width: 100%;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    /* outline: 2px dashed green; */
}

.outputContainer meter {
    display: block;
    width: 80%;
    margin: 0.5em auto;
}

.outputContainer output {
    margin-top: 1em;
    width: 100%;
    font-family: monospace;;
    font-size: x-large;
    white-space: pre-wrap;
}

#rectangleDebug {
    max-width: 100%;
}
</style>
<title>Badge Reader</title>
</head>
<body>
<h1>Badge Reader</h1>

<p>Present a badge with a QR Code to the camera.</p>

<noscript><div class="error">
    ERROR: Scripting is required, but is not currently enabled.  Please enable it and reload. 
</div></noscript>
<div class="error hidden" id="error">
    ERROR: Unknown error.
</div>

<div class="inputContainer">
    <video></video>
</div>

<div class="outputContainer">
    <img src="">
    <meter class="confidence" min="0" max="100" low="33" high="66" optimum="80" value="0">-</meter>
    <output></output>
</div>

<!--
<canvas id="rectangleDebug"></canvas>
-->

<hr>

<ul>
    <li>This demo: <a href="https://danielgjackson.github.io/badger">danielgjackson.github.io/badger</a></li>
    <li>Source code: <a href="https://github.com/danielgjackson/badger">github.com/danielgjackson/badger</a></li>
    <li><a href="https://github.com/danielgjackson/badger/blob/main/LICENSE">License</a></li>
</ul> 

</body>
<script type="module">
import { Badger } from './src/badger.js';

function showError(message) {
    const errorElement = document.querySelector('#error');
    errorElement.innerHTML = message;
    errorElement.classList.remove('hidden');
}

async function run() {
    console.log('Running...');
    const badger = new Badger({});
    let err = await badger.init();
    if (err) {
        showError(err);
        return false;
    }

    console.log('...APIs are supported or successfully polyfilled.');
    err = await badger.start();
    if (err) {
        showError(err);
        return false;
    }

    console.log('...started.');
    return true;
}

addEventListener("DOMContentLoaded", async (event) => {
    run();
});
</script>
</html>
